# docker compose up -d  →  http://localhost:5173
# Ambiente de desenvolvimento: LiveKit em modo dev (devkey/secret). Não usar em produção.
name: lobby

services:
  livekit:
    container_name: lobby_livekit
    image: livekit/livekit-server:v1.13.7
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"     # HTTP/WebSocket (sinalização)
      - "7881:7881"     # WebRTC via TCP (fallback)
      - "7882:7882/udp" # WebRTC via UDP (mídia)

  db:
    container_name: lobby_db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby
      POSTGRES_DB: lobby
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 no host para não colidir com outros Postgres na 5432
    healthcheck:
      test: pg_isready -U lobby
      interval: 2s
      retries: 15

  api:
    container_name: lobby_api
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm start"
    environment:
      PORT: 3001
      WEB_ORIGINS: http://localhost:5173
      DATABASE_URL: postgres://lobby:lobby@db:5432/lobby
      LIVEKIT_URL: ws://localhost:7880 # endereço visto pelo navegador
      LIVEKIT_HOST: http://livekit:7880 # endereço visto pela API (rede do Docker)
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    volumes:
      - ./server:/app
      - /app/node_modules # node_modules do Linux, separado do Windows
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: lobby_web
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on: [api, livekit]

volumes:
  pgdata:
